<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="search.html">Search</a></li>
            <li><a href="performance.html">Performance</a></li>
        </ul>
    </nav>
    <div class="container">
        <div class="auth-box">
            <h2 id="auth-title">Login</h2>
            <form id="auth-form">
                <div class="input-group hidden" id="name-group">
                    <input type="text" id="name" placeholder="Full Name">
                </div>
                <div class="input-group">
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn" id="auth-button">Login</button>
            </form>
            <p class="toggle-text">Don't have an account? <span id="toggle-auth">Sign up</span></p>
        </div>
    </div>

    <script>
        const form = document.getElementById("auth-form");
        const toggleBtn = document.getElementById("toggle-auth");
        const nameGroup = document.getElementById("name-group");
        const authTitle = document.getElementById("auth-title");
        const authButton = document.getElementById("auth-button");

        let isLogin = true;

        toggleBtn.addEventListener("click", () => {
            isLogin = !isLogin;
            authTitle.textContent = isLogin ? "Login" : "Sign Up";
            authButton.textContent = isLogin ? "Login" : "Sign Up";
            toggleBtn.textContent = isLogin ? "Sign up" : "Login";
            nameGroup.classList.toggle("hidden");
        });

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const endpoint = isLogin ? "http://127.0.0.1:5000/login" : "http://127.0.0.1:5000/register";

            const body = isLogin
                ? { email, password }
                : { name, email, password };

            try {
                const res = await fetch(endpoint, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(body)
                });

                const data = await res.json();

                if (res.ok) {
                    alert(data.message || (isLogin ? "Login successful!" : "Signup successful!"));
                    window.location.href = "dashboard.html";
                } else {
                    alert(data.message || "Something went wrong!");
                }
            } catch (err) {
                alert("⚠ Backend not reachable. Is it running?");
                console.error(err);
            }
        });
    </script>
</body>
</html>
